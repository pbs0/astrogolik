const texts=["Ты достойна любви просто потому, что ты есть.","Твоя нежность — это твоя сила.","Ты сияешь даже тогда, когда сама этого не замечаешь.","Тебе можно отдыхать и ничего не доказывать.","Ты умеешь превращать обычные дни в особенные.","Твой голос важен. Твои чувства важны.","Ты прекрасна в своей настоящести.","Ты заслуживаешь доброты — особенно от себя.","Твоя уникальность — настоящее сокровище.","Ты можешь выбирать себя без чувства вины.","В тебе больше света, чем ты думаешь.","Ты имеешь право расти в своём темпе.","Твоя улыбка делает мир чуточку теплее.","Ты уже достаточно хороша.","Ты можешь быть мягкой и смелой одновременно.","Тебе не нужно быть идеальной, чтобы быть любимой.","Сегодня я говорю с собой бережно.","Я доверяю своему внутреннему голосу.","Мои желания имеют значение.","Я выбираю замечать в себе хорошее.","Я разрешаю себе радоваться маленьким победам.","Я достойна заботы и внимания.","Моё сердце заслуживает тепла.","Я на своей стороне — сегодня и всегда."];
const flip=document.getElementById('flipper'),msg=document.getElementById('message'),btn=document.getElementById('action'),spark=document.getElementById('spark');let last=-1,busy=false;
function pick(){let n;do{n=Math.floor(Math.random()*texts.length)}while(n===last&&texts.length>1);last=n;return texts[n]}
function glitter(){spark.innerHTML='';for(let i=0;i<18;i++){const el=document.createElement('i');el.textContent=i%3?'✦':'✧';el.style.setProperty('--x',(Math.random()*340-170)+'px');el.style.setProperty('--y',(Math.random()*420-210)+'px');el.style.setProperty('--delay',(Math.random()*.25)+'s');el.style.color=i%2?'#e4b65b':'#fff5c8';spark.append(el)}spark.classList.remove('go');void spark.offsetWidth;spark.classList.add('go')}
btn.addEventListener('click',()=>{if(busy)return;busy=true;if(!flip.classList.contains('flipped')){msg.textContent=pick();glitter();flip.classList.add('flipped');btn.textContent='💗 Хочу ещё немного любви';setTimeout(()=>busy=false,1350)}else{msg.style.opacity='0';setTimeout(()=>{msg.textContent=pick();glitter();msg.style.opacity='1';busy=false},350)}});
