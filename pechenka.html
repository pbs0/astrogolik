<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f4dbe5"><title>Печенька с предсказанием ♡ Астроголик</title><style>
*{box-sizing:border-box}
:root{--plum:#78425f;--rose:#bd7b96;--gold:#c49a62}
body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 4%,#fffdf4 0%,#fbe8ed 38%,#f0d0df 77%,#e8bfd3 100%);color:var(--plum);font-family:Georgia,'Times New Roman',serif;text-align:center;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:37px 41px;mask-image:linear-gradient(#000,transparent 75%)}
.wrap{max-width:530px;margin:auto;padding:28px 20px 30px;position:relative}
.brand{font-size:12px;letter-spacing:6px;margin-bottom:27px;color:#8d5874}
.eyebrow{font-size:12px;letter-spacing:3px;color:#b0877c;margin-bottom:12px}
h1{font-size:clamp(37px,8vw,53px);line-height:1.12;font-weight:400;margin:0 0 17px;text-shadow:0 1px #fff}
.hint{font-size:18px;line-height:1.55;margin:0 auto 8px;max-width:390px}
.stage{height:320px;display:flex;justify-content:center;align-items:center;position:relative;isolation:isolate}
.stage:before{content:"";position:absolute;width:270px;height:270px;border:1px solid #d4a77d88;border-radius:50%;box-shadow:0 0 0 13px #ffffff3b,0 0 0 14px #d4a77d4d,0 0 60px #fff7d9;z-index:-1}
.stage:after{content:"✧   ·   ✦   ·   ✧";position:absolute;bottom:14px;letter-spacing:18px;color:#bf916a;font-size:16px}
.cookie-button{background:none;border:0;cursor:pointer;padding:16px;position:relative;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.cookie-button:focus-visible{outline:2px solid var(--plum);border-radius:45px}
.cookie{width:252px;height:252px;filter:drop-shadow(0 16px 14px #9d60744b);transition:transform .35s;display:block}
.cookie-button:hover .cookie{transform:rotate(-4deg) scale(1.035)}
.half{transform-origin:50% 50%;transition:transform .75s cubic-bezier(.22,.8,.3,1)}
.open .left{transform:translate(-48px,-14px) rotate(-26deg)}
.open .right{transform:translate(48px,10px) rotate(24deg)}
.sparkle{position:absolute;color:#c89b6e;pointer-events:none;animation:twinkle 3s ease-in-out infinite}
.s1{top:42px;left:10%;font-size:28px}.s2{right:11%;bottom:58px;font-size:24px;animation-delay:.8s}.s3{right:12%;top:40px;font-size:18px;animation-delay:1.5s}
@keyframes twinkle{50%{opacity:.3;transform:scale(.7) rotate(20deg)}}
.paper{display:none;background:linear-gradient(145deg,#fffdf8,#fff5f2);border:1px solid #cba67d;outline:5px solid #ffffff8c;box-shadow:0 12px 35px #ac77903b;border-radius:5px;padding:25px 24px 27px;max-width:420px;margin:0 auto 25px;position:relative;opacity:0;transform:translateY(-30px) scale(.92)}
.paper:before,.paper:after{content:"✧";position:absolute;top:10px;color:#c59b70;font-size:18px}.paper:before{left:13px}.paper:after{right:13px}
.paper.visible{display:block;animation:reveal .65s ease-out forwards}
@keyframes reveal{to{opacity:1;transform:translateY(0) scale(1)}}
.paper .tiny{font-size:11px;letter-spacing:3px;color:#b28c7a}
.message{font-size:clamp(20px,5.2vw,25px);line-height:1.48;margin:19px 0 18px}
.btn{font-family:Georgia,serif;font-size:18px;border:1px solid #b985a0;border-radius:40px;padding:14px 24px;background:#fff8f9;color:var(--plum);cursor:pointer;min-height:52px;box-shadow:0 4px 15px #a7718a18}
.btn:active{transform:scale(.98)}.btn.primary{background:#86506f;color:#fff;border-color:#86506f;display:block;margin:13px auto 0;min-width:240px}
.actions{display:none}.actions.visible{display:block}
.footer{font-style:italic;font-size:17px;margin-top:31px}.status{font-size:14px;color:#986d82;min-height:22px;margin-top:12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
