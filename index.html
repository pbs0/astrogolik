стань откладывать красивую жизнь на потом. Тебе необязательно заслуживать любовь, заботу и удовольствие. Балуй себя, расцветай и разрешай себе хотеть большего.','Не отказывайся от своей мечты только потому, что пока не видишь результатов. Не обесценивай маленькие шаги. Продолжай верить в себя, даже если сейчас твой путь не совсем понятен.','Тебе необязательно быть сильной каждую секунду своей жизни. В нежности, уязвимости и умении относиться к себе с любовью тоже скрывается огромная сила.'];function select(i){cards.forEach((c,j)=>{c.classList.toggle('open',i===j);c.setAttribute('aria-pressed',String(i===j))});if(i<0){message.innerHTML='Какое послание ждёт тебя сегодня?<br>Нажми на свою карту ✨';return}message.replaceChildren();const h=document.createElement('h2'),p=document.createElement('p');h.textContent='♡ '+n[i];p.textContent=m[i];message.append(h,p)}cards.forEach((c,i)=>c.addEventListener('click',()=>select(i)));document.querySelector('.reset').addEventListener('click',()=>select(-1));</script></body></html>
